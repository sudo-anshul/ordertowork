[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ordertowork"
version = "0.1.0"
description = "A Strands-powered workbench for made-to-order businesses"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.40,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "pydantic-settings>=2.9,<3",
  "strands-agents==1.55.0",
  "boto3>=1.38,<2",
  "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["backend/ordertowork"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
markers = ["postgres: requires a running PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
