name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ordertowork
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: ordertowork_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ordertowork -d ordertowork_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OTW_DATABASE_URL: postgresql+psycopg://ordertowork:test-only-password@localhost:55432/ordertowork_test
      OTW_TEST_DATABASE_URL: postgresql+psycopg://ordertowork:test-only-password@localhost:55432/ordertowork_test
      OTW_ENVIRONMENT: development
      OTW_AUTH_MODE: development
      OTW_APP_URL: http://localhost:5173
      OTW_AGENT_MODE: reference
      OTW_STORAGE_MODE: local
      OTW_DATA_DIR: ${{ runner.temp }}/ordertowork-data
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint Python
        run: uv run --no-sync ruff check backend migrations scripts deploy
      - name: Apply migrations
        run: uv run --no-sync alembic upgrade head
      - name: Check for uncommitted model/schema drift
        run: uv run --no-sync alembic check
      - name: Test application and PostgreSQL invariants
        run: uv run --no-sync pytest

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build

  container:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag ordertowork:ci .
      - name: Verify runtime package, built frontend and non-root user
        run: >-
          docker run --rm --entrypoint python ordertowork:ci -c
          "import os; from pathlib import Path; import ordertowork.main;
          assert os.getuid() == 10001;
          assert Path('/app/frontend/dist/index.html').is_file()"
