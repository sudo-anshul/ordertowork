name: ordertowork-budget

x-logging: &logging
  driver: local
  options:
    max-size: "5m"
    max-file: "3"

x-app: &app
  image: ${OTW_IMAGE:?Set an immutable ARM64 ECR image digest}
  platform: linux/arm64
  env_file: ../runtime.env
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: *logging
  networks: [private, outbound]

services:
  db:
    image: ${OTW_POSTGRES_IMAGE:-postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73}
    platform: linux/arm64
    restart: unless-stopped
    environment:
      POSTGRES_USER: otw_migrator
      POSTGRES_DB: ordertowork
      POSTGRES_PASSWORD: ${OTW_POSTGRES_PASSWORD:?Generated by budget-setup.sh}
      OTW_APP_DATABASE_PASSWORD: ${OTW_APP_DATABASE_PASSWORD:?Generated by budget-setup.sh}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=40
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./budget-init-db.sh:/docker-entrypoint-initdb.d/10-application-role.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U otw_migrator -d ordertowork"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    mem_limit: 384m
    pids_limit: 128
    shm_size: 64m
    logging: *logging
    networks: [private]

  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    environment:
      OTW_DATABASE_URL: ${OTW_MIGRATION_DATABASE_URL:?Generated by budget-setup.sh}
    profiles: [maintenance]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 384m
    pids_limit: 128

  api:
    <<: *app
    restart: unless-stopped
    command:
      - uvicorn
      - ordertowork.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    mem_limit: 384m
    pids_limit: 128
    stop_grace_period: 30s

  worker:
    <<: *app
    restart: unless-stopped
    command: [python, -m, ordertowork.worker]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 640m
    pids_limit: 128
    stop_grace_period: 150s

  caddy:
    image: ${OTW_CADDY_IMAGE:-caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d}
    platform: linux/arm64
    restart: unless-stopped
    environment:
      OTW_DOMAIN: ${OTW_DOMAIN:?Set the DNS hostname for the reserved public address}
    ports: ["80:80", "443:443"]
    volumes:
      - ./budget-Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 96m
    pids_limit: 128
    logging: *logging
    networks: [outbound]

volumes:
  postgres:
    name: ordertowork-budget-postgres
  caddy_data:
    name: ordertowork-budget-caddy-data
  caddy_config:
    name: ordertowork-budget-caddy-config

networks:
  private:
    internal: true
  outbound: {}
